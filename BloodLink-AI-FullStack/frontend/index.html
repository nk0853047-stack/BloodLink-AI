<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>BloodLink AI | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">
    <div class="login-shell">
        <div class="brand">
            <div class="logo">🩸</div>
            <div>
                <h1>BloodLink <b>AI</b></h1><small>Predictive Emergency Blood Shortage Network</small>
            </div>
        </div>
        <div class="login-card">
            <div class="eyebrow">NETWORK ACCESS</div>
            <h2>Welcome back</h2>
            <p>Sign in to monitor blood availability, predict shortages and coordinate emergency transfers.</p>
            <form id="loginForm"><label>Email</label><input id="email" type="email" placeholder="admin@bloodlink.ai"
                    required><label>Password</label><input id="password" type="password" placeholder="admin123"
                    required><button class="btn primary" type="submit">Sign In →</button></form>
            <div class="hint">Demo: <b>admin@bloodlink.ai</b> / <b>admin123</b></div>
        </div>
        <footer>© 2026 BloodLink AI · Hackathon Prototype</footer>
    </div>
    <script src="app.js"></script>
</body>

</html>
